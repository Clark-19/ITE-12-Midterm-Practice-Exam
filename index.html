<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITE 12 Interactive Lab</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--surface:#fff;--surface2:#eef1f7;--text:#172033;--muted:#667085;--line:#d9deea;--accent:#5b5bd6;--good:#15803d;--bad:#dc2626;--warn:#b45309;--code:#111827}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#151b23;--surface2:#202833;--text:#edf2f7;--muted:#aab4c2;--line:#303a47;--accent:#8b87ff;--good:#4ade80;--bad:#fb7185;--warn:#fbbf24;--code:#0b0f14}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background-color:var(--bg);border-radius:0}.wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}.hero h1{margin:5px 0 6px;font-size:clamp(28px,5vw,46px);line-height:1}.hero p{margin:0;color:var(--muted)}.score{background:var(--surface);border:1px solid var(--line);padding:12px 16px;border-radius:16px;text-align:center;min-width:110px}.score b{font-size:24px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px;margin-bottom:16px}.tab{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;font-weight:700}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 30px #0000000d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.question{font-size:20px;font-weight:800;line-height:1.35;margin:10px 0 16px}.choices{display:grid;gap:10px}.choice,.action{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-weight:650}.choice:hover,.action:hover{border-color:var(--accent)}.choice.correct{border-color:var(--good);background:#15803d18}.choice.wrong{border-color:var(--bad);background:#dc262618}.action.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-align:center}.action:disabled{opacity:.5;cursor:not-allowed}.feedback{margin-top:14px;padding:12px;border-radius:12px;background:var(--surface2);line-height:1.5}.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 18px}.bar span{display:block;height:100%;background:var(--accent);width:0;transition:.25s}.code{background:var(--code);color:#e5e7eb;border-radius:14px;padding:15px;white-space:pre-wrap;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.trace-table{width:100%;border-collapse:collapse}.trace-table th,.trace-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.trace-table tr.current{background:#5b5bd620}.editor{width:100%;min-height:220px;background:var(--code);color:#e5e7eb;border:0;border-radius:14px;padding:16px;font:14px/1.6 ui-monospace,monospace;resize:vertical;outline:none}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#5b5bd618;color:var(--accent);font-size:12px;font-weight:800}.steps{display:flex;flex-wrap:wrap;gap:9px}.step{padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer}.step.selected{background:var(--accent);color:white}.dropzone{min-height:55px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:13px}.kbd{font-family:monospace;background:var(--surface2);border:1px solid var(--line);padding:2px 6px;border-radius:5px}.hide{display:none}.danger{color:var(--bad)}.good{color:var(--good)}@media(min-width:701px){
  .wrap{max-width:1280px;padding:30px 28px 64px}
  .hero{margin-bottom:24px;align-items:center}
  .hero h1{font-size:clamp(34px,4vw,50px)}
  .score{min-width:150px;padding:14px 20px}
  .score b{font-size:28px}
  .tabs{gap:10px;padding:5px;margin-bottom:22px}
  .tab{padding:11px 18px}
  .panel{padding:28px;border-radius:22px;box-shadow:0 12px 36px #00000012}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .card{padding:20px}
  .question{max-width:1050px;font-size:22px;margin:14px 0 20px}
  .choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .choice,.action{padding:13px 16px}
  .trace-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .trace-card{height:100%}
  .trace-table{font-size:15px}
  .trace-table th,.trace-table td{padding:12px 14px}
  .editor{min-height:360px;font-size:15px;line-height:1.65;padding:18px 20px}
  .code{font-size:15px;line-height:1.65;padding:18px 20px}
  .steps{gap:10px}
  .step{padding:12px 14px}
  .row.nav-row{justify-content:flex-end;align-items:center;margin-top:18px}
  .row.nav-row .action:first-child{margin-right:auto}
  .feedback{max-width:1050px}
}
@media(max-width:700px){.hero{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.panel{padding:15px}.question{font-size:18px}}
</style>
</head>
<body><div id="app"><div class="wrap">
<header class="hero"><div><div class="eyebrow">ITE 12 • Fundamentals of Programming</div><h1>Interactive C Lab</h1><p>MCQ • Tracing • Debug • Algo • Coding</p></div><div class="score"><div class="muted mini" id="scoreLabel">Easy Score</div><b id="xp">0</b></div></header>
<div class="tabs" id="tabs"></div><div id="content"></div>
</div></div>
<script>
const state={mode:'home',level:'easy',xp:0,scores:{easy:0,average:0,difficult:0},earned:{},done:{},mcqIndex:0,traceIndex:0,debugIndex:0,algoIndex:0,codeIndex:0,answers:{easy:{},average:{},difficult:{}},mcqChoices:{easy:{},average:{},difficult:{}},progress:{easy:{mcqIndex:0,traceIndex:0,debugIndex:0,algoIndex:0,codeIndex:0},average:{mcqIndex:0,traceIndex:0,debugIndex:0,algoIndex:0,codeIndex:0},difficult:{mcqIndex:0,traceIndex:0,debugIndex:0,algoIndex:0,codeIndex:0}}};
const mcqs=[
['What does printf primarily do in a C program?',['Get input','Display output','Repeat code','Compare values'],1,'printf is used to display output.'],
['Which operator checks whether two values are equal?',['=','!=','==','>='],2,'= assigns a value; == compares values.'],
['Which control structure is used when a program must choose between conditions?',['Sequence','Selection','Repetition','Compilation'],1,'Selection makes decisions using conditions.'],
['What does % mean in an arithmetic expression such as 10 % 3?',['Percentage','Remainder','Division','Power'],1,'10 % 3 gives the remainder, which is 1.'],
['Which is a logical AND operator in C?',['||','&&','!','=='],1,'&& is true when both conditions are true.'],
['Which error allows a program to run but produces the wrong result?',['Syntax error','Linker error','Logical error','Header error'],2,'A logical error is a mistake in the program logic.'],
['Which is best for checking one variable against several fixed constant values?',['switch-case','printf','scanf','include'],0,'The lessons describe switch-case for this situation.'],
['What happens if break is omitted in a switch case?',['The program always stops','Execution may fall through to later cases','The case becomes invalid','The switch becomes an if'],1,'Without break, execution can continue into later cases.'],
['What is an algorithm?',['A compiler error','A step-by-step procedure for solving a problem','A data type','A library'],1,'An algorithm gives specific steps for solving a problem.'],
['Which stage comes after Algorithm Development?',['Maintenance','Problem Definition','Coding and Documentation','Problem Analysis'],2,'The six stages put Coding and Documentation after Algorithm Development.']
];
const traces=[
{title:'Trace the assignment',code:`int x = 4;\nx = x + 3;\nprintf("%d", x);`,rows:[['Start','x = 4'],['x = x + 3','x = 7'],['printf','Output: 7']],answer:'7'},
{title:'Trace the condition',code:`int n = 8;\nif (n > 5)\n    printf("A");\nelse\n    printf("B");`,rows:[['n = 8','n = 8'],['n > 5','TRUE'],['if branch','Output: A']],answer:'A'},
{title:'Trace the remainder',code:`int n = 7;\nif (n % 2 == 0)\n    printf("Even");\nelse\n    printf("Odd");`,rows:[['n = 7','n = 7'],['7 % 2','1'],['1 == 0','FALSE'],['else','Output: Odd']],answer:'Odd'},
{title:'Trace switch fall-through',code:`int n = 2;\nswitch(n) {\ncase 1: printf("A"); break;\ncase 2: printf("B");\ncase 3: printf("C"); break;\ndefault: printf("D");\n}`,rows:[['n = 2','match case 2'],['case 2','Output B'],['no break','continue'],['case 3','Output C'],['break','stop']],answer:'BC'}
];
const debugs=[
{q:'Find the bug that prevents this statement from being valid C.',code:`int age = 18\nprintf("%d", age);`,opts:['Missing semicolon after 18','Wrong data type','printf needs ==','age cannot be 18'],a:0,e:'The declaration needs a semicolon: int age = 18;'},
{q:'Find the bug.',code:`int age = 18;\nif (age = 18)\n    printf("Adult");`,opts:['printf is wrong','Use == for comparison','age must be float','if cannot use numbers'],a:1,e:'age = 18 assigns; age == 18 compares.'},
{q:'What is the main switch problem?',code:`float grade = 80.5;\nswitch (grade) {\ncase 80: printf("Good"); break;\n}`,opts:['switch cannot use float','case needs printf','break is illegal','float is always invalid'],a:0,e:'The lesson specifically notes that switch expressions should not use float; use if-else for floating-point comparisons.'},
{q:'What causes the unexpected extra output?',code:`switch(n) {\ncase 2: printf("B");\ncase 3: printf("C"); break;\n}`,opts:['case 2 is invalid','Missing break after case 2','printf cannot be used','n must be float'],a:1,e:'Without break after case 2, execution falls through to case 3.'}
];
const algos=[
{q:'Arrange the steps for: Read two numbers, add them, then display the sum.',items:['START','INPUT first number','INPUT second number','sum = first + second','DISPLAY sum','END'],correct:['START','INPUT first number','INPUT second number','sum = first + second','DISPLAY sum','END']},
{q:'Arrange the logic for: Print Pass if grade is at least 60; otherwise Fail.',items:['START','INPUT grade','IF grade >= 60','DISPLAY Pass','ELSE','DISPLAY Fail','END'],correct:['START','INPUT grade','IF grade >= 60','DISPLAY Pass','ELSE','DISPLAY Fail','END']},
{q:'Arrange the development stages in the order used in the lesson.',items:['Problem Definition','Problem Analysis','Algorithm Development','Coding and Documentation','Testing and Debugging','Maintenance'],correct:['Problem Definition','Problem Analysis','Algorithm Development','Coding and Documentation','Testing and Debugging','Maintenance']}
];
const codes=[
{q:'Write code that displays the value of x. Start with int x = 12;',starter:`#include <stdio.h>\n\nint main() {\n    int x = 12;\n    // write your code here\n    return 0;\n}`,tests:['printf("%d", x);'],hint:'Use printf with %d because x is an int.'},
{q:'Complete the program so it prints Pass when grade is 60 or higher.',starter:`#include <stdio.h>\n\nint main() {\n    int grade = 75;\n    // write your if statement here\n    return 0;\n}`,tests:['if (grade >= 60)', 'printf("Pass")'],hint:'You need if (grade >= 60) and printf("Pass").'},
{q:'Complete the program to print Even when n is even.',starter:`#include <stdio.h>\n\nint main() {\n    int n = 8;\n    // use % and if here\n    return 0;\n}`,tests:['n % 2 == 0','printf("Even")'],hint:'Even numbers have a remainder of 0 when divided by 2.'}
];
function addXP(n,key){if(key&&state.earned[key])return false;if(key)state.earned[key]=true;state.scores[state.level||'easy']+=n;state.xp=state.scores[state.level||'easy'];document.querySelector('#xp').textContent=state.xp;document.querySelector('#scoreLabel').textContent=difficulty[state.level||'easy'].label+' Score';return true}
function tabs(){const data=[['home','Home'],['mcq','MCQ'],['trace','Tracing'],['debug','Debug'],['algo','Algo Builder'],['code','Coding']];document.querySelector('#tabs').innerHTML=data.map(x=>`<button class="tab ${state.mode===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function syncScore(){state.xp=state.scores[state.level]||0;document.querySelector('#xp').textContent=state.xp;document.querySelector('#scoreLabel').textContent=difficulty[state.level].label+' Score'}
function saveCurrent(){const mode=state.mode;if(mode==='home')return;const level=state.level;if(!state.answers[level])state.answers[level]={};const idx=state[mode+'Index'];if(idx==null)return;const key=mode+':'+idx;const a=state.answers[level];if(mode==='trace'){a[key]=[...document.querySelectorAll('.trace-answer')].map(x=>x.value)}else if(mode==='debug'){const e=document.querySelector('#debugger');if(e)a[key]=e.value}else if(mode==='algo'){const e=document.querySelector('#algoanswer');if(e)a[key]=e.value}else if(mode==='code'){const e=document.querySelector('#editor');if(e)a[key]=e.value}}
function restoreAnswer(mode,idx,selector){const a=state.answers[state.level]?.[mode+':'+idx];if(a==null)return null;if(mode==='trace'){document.querySelectorAll('.trace-answer').forEach((e,i)=>{e.value=a[i]||''})}else{const e=document.querySelector(selector);if(e)e.value=a}return a}
function go(m){saveCurrent();state.mode=m;render()}
function render(){tabs();syncScore();const c=document.querySelector('#content');if(state.mode==='home')home(c);if(state.mode==='mcq')mcq(c);if(state.mode==='trace')trace(c);if(state.mode==='debug')debug(c);if(state.mode==='algo')algo(c);if(state.mode==='code')code(c);setTimeout(()=>{attachAutoIndent();restoreAnswer(state.mode,state[state.mode+'Index'],'#editor')},0)}
function home(c){c.innerHTML=`<div class="panel"><span class="tag">ACTIVE LEARNING</span><h2>Don't just read it. Do it.</h2><p class="muted">This lab is built from the three ITE 12 lesson files. Pick a mode and practice the same concepts through different actions.</p><div class="grid"><div class="card"><h3>MCQ</h3><p>Choose an answer and get immediate feedback.</p><button class="action primary" onclick="go('mcq')">Start MCQ</button></div><div class="card"><h3>Tracing</h3><p>Follow variables and conditions step by step.</p><button class="action primary" onclick="go('trace')">Start Tracing</button></div><div class="card"><h3>Debug</h3><p>Find the actual programming mistake, not just memorize errors.</p><button class="action primary" onclick="go('debug')">Start Debugging</button></div><div class="card"><h3>Algo Builder</h3><p>Arrange algorithm steps by dragging or tapping.</p><button class="action primary" onclick="go('algo')">Build an Algorithm</button></div><div class="card"><h3>Coding</h3><p>Type the missing C code and run a built-in checker.</p><button class="action primary" onclick="go('code')">Start Coding</button></div><div class="card"><h3>Core map</h3><p><b>Sequence</b> = order<br><b>Selection</b> = choose<br><b>Repetition</b> = repeat</p><p class="muted mini">printf = output • scanf = input • == = compare • = = assign</p></div></div></div>`}
function mcq(c){let i=state.mcqIndex%mcqs.length,q=mcqs[i];c.innerHTML=`<div class="panel"><div class="muted">Question ${i+1} of ${mcqs.length}</div><div class="bar"><span style="width:${((i)/mcqs.length)*100}%"></span></div><div class="question">${q[0]}</div><div class="choices">${q[1].map((x,j)=>`<button class="choice" onclick="answerMCQ(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}</div><div id="mcqfb"></div></div>`}
function answerMCQ(j){const q=mcqs[state.mcqIndex%mcqs.length], buttons=document.querySelectorAll('.choice');buttons.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===j&&j!==q[2])b.classList.add('wrong')});document.querySelector('#mcqfb').innerHTML=`<div class="feedback ${j===q[2]?'good':'danger'}"><b>${j===q[2]?'Correct! +10 XP':'Not quite.'}</b> ${q[3]}<div class="row"><button class="action primary" onclick="nextMCQ()">${state.mcqIndex+1===mcqs.length?'Restart':'Next'}</button></div></div>`;if(j===q[2])addXP(10)}
function nextMCQ(){state.mcqIndex=(state.mcqIndex+1)%mcqs.length;render()}
function trace(c){let q=traces[state.traceIndex%traces.length];c.innerHTML=`<div class="panel"><div class="muted">Tracing ${state.traceIndex+1} of ${traces.length}</div><h2>${q.title}</h2><pre class="code">${q.code}</pre><p>Click each step in order. Watch the variable values.</p><table class="trace-table"><thead><tr><th>Step</th><th>What happens?</th></tr></thead><tbody>${q.rows.map((r,i)=>`<tr class="${i===0?'current':''}" data-i="${i}"><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table><div class="row"><button class="action primary" onclick="traceNext()">Reveal next step</button><button class="action" onclick="render()">Reset</button></div><div id="tracefb" class="feedback">Start at the first row.</div></div>`;state.traceStep=0}
function traceNext(){let q=traces[state.traceIndex%traces.length];if(state.traceStep<q.rows.length){document.querySelectorAll('.trace-table tr').forEach(r=>r.classList.remove('current'));let row=document.querySelectorAll('.trace-table tbody tr')[state.traceStep];row.classList.add('current');document.querySelector('#tracefb').textContent=q.rows[state.traceStep][1];state.traceStep++;if(state.traceStep===q.rows.length){addXP(15);document.querySelector('#tracefb').innerHTML='<span class="good"><b>Trace complete! +15 XP</b></span>'}}else{state.traceIndex=(state.traceIndex+1)%traces.length;render()}}
function debug(c){let q=debugs[state.debugIndex%debugs.length];c.innerHTML=`<div class="panel"><div class="muted">Debug ${state.debugIndex+1} of ${debugs.length}</div><div class="question">${q.q}</div><pre class="code">${q.code}</pre><div class="choices">${q.opts.map((x,j)=>`<button class="choice" onclick="answerDebug(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}</div><div id="debugfb"></div></div>`}
function answerDebug(j){let q=debugs[state.debugIndex%debugs.length],bs=document.querySelectorAll('.choice');bs.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');if(k===j&&j!==q.a)b.classList.add('wrong')});document.querySelector('#debugfb').innerHTML=`<div class="feedback ${j===q.a?'good':'danger'}"><b>${j===q.a?'Fixed! +15 XP':'Look again.'}</b> ${q.e}<div class="row"><button class="action primary" onclick="nextDebug()">Next</button></div></div>`;if(j===q.a)addXP(15)}
function nextDebug(){state.debugIndex=(state.debugIndex+1)%debugs.length;render()}
function algo(c){let q=algos[state.algoIndex%algos.length];let shuffled=[...q.items].sort(()=>Math.random()-.5);c.innerHTML=`<div class="panel"><div class="muted">Algo Builder ${state.algoIndex+1} of ${algos.length}</div><h2>${q.q}</h2><p class="muted">Tap the steps in the correct order. Your selected order appears below.</p><div class="steps" id="pool">${shuffled.map((x,i)=>`<button class="step" data-value="${encodeURIComponent(x)}" onclick="pickStep(this)">${x}</button>`).join('')}</div><h3>Your order</h3><div class="dropzone" id="chosen"></div><div class="row"><button class="action" onclick="clearAlgo()">Clear</button><button class="action primary" onclick="checkAlgo()">Check</button></div><div id="algofb"></div></div>`}
function pickStep(el){el.disabled=true;el.classList.add('selected');const v=decodeURIComponent(el.dataset.value);document.querySelector('#chosen').insertAdjacentHTML('beforeend',`<span class="step selected" data-v="${encodeURIComponent(v)}">${v}</span>`)}
function clearAlgo(){algo(document.querySelector('#content'))}
function checkAlgo(){let q=algos[state.algoIndex%algos.length],got=[...document.querySelectorAll('#chosen .step')].map(x=>decodeURIComponent(x.dataset.v));let ok=JSON.stringify(got)===JSON.stringify(q.correct);document.querySelector('#algofb').innerHTML=`<div class="feedback ${ok?'good':'danger'}"><b>${ok?'Correct! +20 XP':'Not yet.'}</b> ${ok?'You built the algorithm in the required order.':'Check the order and try again.'}<div class="row">${ok?'<button class="action primary" onclick="nextAlgo()">Next</button>':''}</div></div>`;if(ok)addXP(20)}
function nextAlgo(){state.algoIndex=(state.algoIndex+1)%algos.length;render()}
function code(c){let q=codes[state.codeIndex%codes.length];c.innerHTML=`<div class="panel"><div class="muted">Coding ${state.codeIndex+1} of ${codes.length}</div><h2>${q.q}</h2><p class="muted">Type the missing code. This is a local beginner checker, so it checks the required C concepts/patterns rather than compiling a full C compiler.</p><textarea class="editor" id="editor" spellcheck="false">${q.starter}</textarea><div class="row"><button class="action primary" onclick="runCode()">Run Check</button><button class="action" onclick="showHint()">Hint</button></div><div id="codefb"></div></div>`}
function runCode(){let q=codes[state.codeIndex%codes.length],v=document.querySelector('#editor').value,ok=q.tests.every(t=>v.replace(/\s+/g,' ').includes(t.replace(/\s+/g,' ')));document.querySelector('#codefb').innerHTML=`<div class="feedback ${ok?'good':'danger'}"><b>${ok?'Tests passed! +25 XP':'Tests failed.'}</b> ${ok?'Your code contains the required solution pattern.':'The required concept is still missing. Read the hint and try again.'}<div class="code" style="margin-top:10px">${ok?'Expected concept satisfied.':'Hint: '+q.hint}</div>${ok?'<div class="row"><button class="action primary" onclick="nextCode()">Next Challenge</button></div>':''}</div>`;if(ok)addXP(25)}
function showHint(){let q=codes[state.codeIndex%codes.length];document.querySelector('#codefb').innerHTML=`<div class="feedback"><b>Hint:</b> ${q.hint}</div>`}
function nextCode(){state.codeIndex=(state.codeIndex+1)%codes.length;render()}
mcqs.push(
['Which header is used for printf and scanf?',['stdlib.h','stdio.h','string.h','math.h'],1,'stdio.h is the standard input/output header used in these lessons.'],
['Which data type stores a single character?',['int','float','double','char'],3,'char stores a single character.'],
['What does scanf primarily do?',['Display output','Get input','Repeat code','Compare values'],1,'scanf is used to get input.'],
['Which symbol is commonly placed before a variable in scanf?',['#','&','%','@'],1,'& gives scanf the variable address where input is stored.'],
['What is 7 / 2 when both values are integers?',['3.5','3','2','4'],1,'Integer division gives 3.'],
['Which structure repeats a set of statements?',['Sequence','Selection','Repetition','Declaration'],2,'Repetition is used to repeat statements.'],
['Which operator means NOT equal?',['!=','==','&&','||'],0,'!= means not equal.'],
['Which logical operator means OR?',['&&','||','!','%'],1,'|| means OR.'],
['Which condition means x is at least 10?',['x = 10','x > 10','x >= 10','x <= 10'],2,'>= means greater than or equal to.'],
['What does return 0 commonly indicate at the end of main?',['Input is finished','The program ended successfully','A loop must repeat','A variable is zero'],1,'return 0 ends main successfully.'],
['Which is a valid C identifier?',['2total','total-value','total_value','int'],2,'total_value follows the naming rules.'],
['Which error is caused by invalid C grammar such as a missing semicolon?',['Syntax error','Logical error','Run-time error','Linker error'],0,'A syntax error breaks the language rules.'],
['Which error can run but produce the wrong result?',['Syntax error','Logical error','Header error','Linker error'],1,'A logical error is a mistake in program logic.'],
['What does preprocessing handle?',['Program execution','#include and other preprocessor directives','Keyboard input','Logical mistakes'],1,'Preprocessing handles directives before compilation.'],
['What does the linker do?',['Combines needed program parts and libraries','Writes the algorithm','Reads keyboard input','Checks the final answer'],0,'Linking combines program parts and libraries.'],
['Which development stage comes first?',['Coding','Testing','Problem Definition','Maintenance'],2,'The process begins with Problem Definition.'],
['What is pseudocode mainly used for?',['Planning program logic in readable steps','Compiling C','Storing numbers','Replacing all code'],0,'Pseudocode plans logic without exact C syntax.'],

    D('For loop trace','int i;\nfor(i=1;i<=3;i++) printf("%d",i);',[['i=1','1'],['i<=3','TRUE'],['printf','1'],['i++','2'],['printf','2'],['i++','3'],['printf','3'],['i++','4'],['i<=3','FALSE']]),
    D('While loop trace','int i=1;\nwhile(i<=3){ printf("%d",i); i++; }',[['i=1','1'],['i<=3','TRUE'],['printf','1'],['i++','2'],['printf','2'],['i++','3'],['printf','3'],['i++','4'],['i<=3','FALSE']])
  );
  difficulty.average.trace.push(
    D('Do-while trace','int i=3;\ndo { printf("%d",i); i--; } while(i>0);',[['i=3','3'],['printf','3'],['i--','2'],['condition','TRUE'],['printf','2'],['i--','1'],['condition','TRUE'],['printf','1'],['i--','0'],['condition','FALSE']]),
    D('Break in loop','int i;\nfor(i=1;i<=5;i++){ if(i==3) break; printf("%d",i); }',[['i=1','1'],['i==3','FALSE'],['printf','1'],['i=2','2'],['i==3','FALSE'],['printf','2'],['i=3','3'],['i==3','TRUE'],['break','stop']]),
    D('Continue in loop','int i;\nfor(i=1;i<=4;i++){ if(i==3) continue; printf("%d",i); }',[['i=1','1'],['printf','1'],['i=2','2'],['printf','2'],['i=3','3'],['i==3','TRUE'],['continue','skip printf'],['i=4','4'],['printf','4']])
  );
  difficulty.difficult.trace.push(
    D('Nested loop trace','int i,j;\nfor(i=1;i<=2;i++){ for(j=1;j<=2;j++) printf("%d%d",i,j); }',[['i=1','1'],['j=1','1'],['printf','11'],['j=2','2'],['printf','12'],['i=2','2'],['j=1','1'],['printf','21'],['j=2','2'],['printf','22']]),
    D('While with break','int i=1,sum=0;\nwhile(i<=5){ sum=sum+i; if(sum>=6) break; i++; }',[['i=1','1'],['sum=0','0'],['sum=sum+i','1'],['sum>=6','FALSE'],['i++','2'],['sum=sum+i','3'],['i++','3'],['sum=sum+i','6'],['sum>=6','TRUE'],['break','stop']])
  );
}

function addLoopAlgos(){
  difficulty.easy.algo.push(
    ALG('Write pseudocode that displays the numbers 1 to 5 using a FOR loop.','START\nFOR i = 1 TO 5 DO\nDISPLAY i\nENDFOR\nEND','Use FOR, TO, DO, DISPLAY, and ENDFOR.'),
    ALG('Write pseudocode that keeps reading numbers while n is greater than 0.','START\nINPUT n\nWHILE n > 0 DO\nDISPLAY n\nINPUT n\nENDWHILE\nEND','Use WHILE for repetition while the condition is true.')
  );
  difficulty.average.algo.push(
    ALG('Write pseudocode that repeats from 1 to 10 and stops when i is 5 using BREAK.','START\nFOR i = 1 TO 10 DO\nIF i == 5 THEN\nBREAK\nENDIF\nDISPLAY i\nENDFOR\nEND','Put BREAK inside the condition when i reaches 5.'),
    ALG('Write pseudocode that displays 1, 2, 3 using a DO-WHILE style loop.','START\ni = 1\nDO\nDISPLAY i\ni = i + 1\nWHILE i <= 3\nEND','The body runs before the condition is checked.')
  );
  difficulty.difficult.algo.push(
    ALG('Write pseudocode that reads numbers until 0 is entered, adds positive numbers, and then displays the sum.','START\nsum = 0\nINPUT n\nWHILE n != 0 DO\nIF n > 0 THEN\nsum = sum + n\nENDIF\nINPUT n\nENDWHILE\nDISPLAY sum\nEND','Combine WHILE, IF, accumulation, and a stopping value.'),
    ALG('Write pseudocode for a loop that skips 3 using CONTINUE and displays the other numbers from 1 to 5.','START\nFOR i = 1 TO 5 DO\nIF i == 3 THEN\nCONTINUE\nENDIF\nDISPLAY i\nENDFOR\nEND','CONTINUE skips the rest of the current iteration.')

}

function active(kind){return difficulty[state.level][kind]}
function levelTabs(){return '<div class="levelbar">'+Object.keys(difficulty).map(k=>'<button class="tab '+(state.level===k?'active':'')+'" onclick="setLevel(\''+k+'\')">'+difficulty[k].label+'</button>').join('')+'</div>'}
function setLevel(k){saveCurrent();if(state.mode!=='home')state.progress[state.level][state.mode+'Index']=state[state.mode+'Index'];const oldMode=state.mode;state.level=k;state.mode=oldMode||'home';if(state.mode!=='home')state[state.mode+'Index']=state.progress[k][state.mode+'Index']||0;render()}
function previousItem(){saveCurrent();const key=state.mode+'Index',a=active(state.mode);if(!a||!a.length)return;state[key]=(state[key]-1+a.length)%a.length;state.progress[state.level][key]=state[key];render()}
function restartMode(){const mode=state.mode;if(mode==='home')return;const a=active(mode);if(!a||!a.length)return;saveCurrent();state[mode+'Index']=0;state.progress[state.level][mode+'Index']=0;state.answers[state.level][mode+':0']=undefined;if(mode==='mcq')state.mcqChoices[state.level]={};delete state.answers[state.level][mode+':0'];for(const k of Object.keys(state.answers[state.level]))if(k.startsWith(mode+':'))delete state.answers[state.level][k];render()}
function home(c){c.innerHTML='<div class="panel"><span class="tag">EXAM TRAINING</span><h2>Pick a difficulty — then keep practicing.</h2><p class="muted">Easy builds recall. Average makes you apply syntax. Difficult uses longer combined problems. Each mode has a large bank.</p>'+levelTabs()+'<div class="grid"><div class="card"><h3>MCQ • '+active('mcq').length+'</h3><p>Syntax, operators, flowchart symbols, C history, format specifiers, errors, and control structures.</p><button class="action primary" onclick="go(\'mcq\')">Start MCQ</button></div><div class="card"><h3>Tracing • '+active('trace').length+'</h3><p>Trace values, conditions, nested if, logical operators, and switch fall-through.</p><button class="action primary" onclick="go(\'trace\')">Start Tracing</button></div><div class="card"><h3>Debug • '+active('debug').length+'</h3><p>Edit broken C code yourself. No multiple-choice shortcut.</p><button class="action primary" onclick="go(\'debug\')">Start Debugging</button></div><div class="card"><h3>Algo • '+active('algo').length+'</h3><p>Type the algorithm lines yourself instead of being handed the pieces.</p><button class="action primary" onclick="go(\'algo\')">Write Algorithms</button></div><div class="card"><h3>Coding • '+active('code').length+'</h3><p>Start from a blank editor and write the whole C program. Different valid printf outputs are accepted.</p><button class="action primary" onclick="go(\'code\')">Start Coding</button></div><div class="card"><h3>Coverage</h3><p><b>if / else / else-if / nested if</b><br><b>switch / case / break / default</b><br><b>printf / scanf / sprintf</b><br><b>loops / operators / flowcharts / algorithms</b></p></div></div></div>'}
function navButtons(nextFn,label){return '<div class="row nav-row"><button class="action" onclick="previousItem()">← Previous</button><button class="action" onclick="restartMode()">↻ Restart</button><button class="action primary" onclick="'+nextFn+'()">'+label+' →</button></div>'}
function mcq(c){let a=active('mcq'),i=state.mcqIndex%a.length,q=a[i],saved=state.mcqChoices[state.level]?.[i];c.innerHTML='<div class="panel">'+levelTabs()+'<div class="muted">'+difficulty[state.level].label+' MCQ • Question '+(i+1)+' of '+a.length+'</div><div class="bar"><span style="width:'+((i)/a.length)*100+'%"></span></div><div class="question">'+q[0]+'</div><div class="choices">'+q[1].map((x,j)=>'<button class="choice" '+(saved!=null?'disabled':'')+' onclick="answerMCQ2('+j+')">'+String.fromCharCode(65+j)+'. '+x+'</button>').join('')+'</div><div id="mcqfb"></div>'+navButtons('nextMCQ2','Next')+'</div>';if(saved!=null){document.querySelectorAll('.choice').forEach((b,k)=>{if(k===q[2])b.classList.add('correct');if(k===saved&&saved!==q[2])b.classList.add('wrong')});document.querySelector('#mcqfb').innerHTML='<div class="feedback '+(saved===q[2]?'good':'danger')+'"><b>'+(saved===q[2]?'Correct! +10 Score':'Not quite.')+'</b> '+q[3]+'</div>'}}
function answerMCQ2(j){let q=active('mcq')[state.mcqIndex%active('mcq').length],b=document.querySelectorAll('.choice');state.mcqChoices[state.level][state.mcqIndex]=j;b.forEach((x,k)=>{x.disabled=true;if(k===q[2])x.classList.add('correct');if(k===j&&j!==q[2])x.classList.add('wrong')});document.querySelector('#mcqfb').innerHTML='<div class="feedback '+(j===q[2]?'good':'danger')+'"><b>'+(j===q[2]?'Correct! +10 Score':'Not quite.')+'</b> '+q[3]+'</div>';if(j===q[2])addXP(10,'mcq:'+state.level+':'+state.mcqIndex)}
function nextMCQ2(){saveCurrent();state.mcqIndex=(state.mcqIndex+1)%active('mcq').length;state.progress[state.level].mcqIndex=state.mcqIndex;render()}
function trace(c){let a=active('trace'),q=a[state.traceIndex%a.length],i=state.traceIndex;c.innerHTML='<div class="panel">'+levelTabs()+'<div class="muted">'+difficulty[state.level].label+' Tracing • '+(i+1)+' of '+a.length+'</div><h2>'+q.title+'</h2><pre class="code">'+q.code+'</pre><p>Type what happens for each step. For output, type exactly what you think the program prints. For terms like TRUE/FALSE, type the term.</p><div class="trace-inputs">'+q.rows.map((r,j)=>'<div class="card trace-card"><b>'+r[0]+'</b><input class="trace-answer" id="tracein'+j+'" placeholder="Type the result..." autocomplete="off"></div>').join('')+'</div><div class="row"><button class="action primary" onclick="checkTrace2()">Check Trace</button><button class="action" onclick="document.querySelectorAll(\'.trace-answer\').forEach(x=>x.value=\'\')">Clear</button><button class="action" onclick="showTraceHint()">Hint</button></div><div id="tracefb" class="feedback">Nothing is revealed until you check your answers.</div>'+navButtons('nextTrace2','Next Trace')+'</div>';setTimeout(()=>restoreAnswer('trace',i),0)}
function showTraceHint(){let q=active('trace')[state.traceIndex%active('trace').length];document.querySelector('#tracefb').innerHTML='<div class="feedback"><b>Hint:</b> Follow the code from top to bottom and record each changed value or output.</div>'}
function normTrace(s){return s.toLowerCase().replace(/["']/g,'').replace(/\s+/g,' ').trim()}
function checkTrace2(){saveCurrent();let q=active('trace')[state.traceIndex%active('trace').length],ok=true;q.rows.forEach((r,i)=>{let el=document.querySelector('#tracein'+i),ans=normTrace(el.value),expected=normTrace(r[1]);if(ans===expected)el.style.outline='2px solid var(--good)';else{el.style.outline='2px solid var(--bad)';ok=false}});let earned=ok&&addXP(15,'trace:'+state.level+':'+state.traceIndex);document.querySelector('#tracefb').innerHTML='<b class="'+(ok?'good':'danger')+'">'+(ok?'Correct trace! +15 Score':'Some answers are incorrect.')+'</b> '+(ok?'You traced every step correctly.':'Check the red fields and try again. The correct answers are not revealed yet.')+(ok?'<div class="row"><button class="action primary" onclick="nextTrace2()">Next Trace</button></div>':'')+(ok&&!earned?'<div class="muted mini">Score already awarded for this problem.</div>':'')}
function nextTrace2(){saveCurrent();state.traceIndex=(state.traceIndex+1)%active('trace').length;state.progress[state.level].traceIndex=state.traceIndex;render()}
function debugProgram(s){let names=['n','age','score','hasID','price','average','grade','menu','choice','gpa','credits','international','english','a','b','x','y','total','number','i','count'];let declarations=[];for(const name of names){if(new RegExp('\\b'+name+'\\b').test(s)&&!new RegExp('(?:int|float|double|char)\\s+(?:\\w+\\s*,\\s*)*'+name+'\\b').test(s)){if(['price','average'].includes(name))declarations.push('double '+name+' = 10.5;');else if(name==='international'||name==='hasID')declarations.push('int '+name+' = 1;');else if(name==='gpa')declarations.push('double '+name+' = 3.6;');else if(name==='grade'||name==='score'||name==='english')declarations.push('int '+name+' = 85;');else declarations.push('int '+name+' = 8;')}}return '#include <stdio.h>\n\nint main() {\n    '+declarations.join('\n    ')+'\n    '+s.replace(/\n/g,'\n    ')+'\n    return 0;\n}'}
function debug(c){let a=active('debug'),i=state.debugIndex,q=a[i%a.length];c.innerHTML='<div class="panel">'+levelTabs()+'<div class="muted">'+difficulty[state.level].label+' Debug • '+(i+1)+' of '+a.length+'</div><div class="question">'+q.q+'</div><p class="muted">Find the error and fix it. The complete C program is shown, including the header, main function, braces, and return statement.</p><textarea class="editor" id="debugger" spellcheck="false">'+debugProgram(q.code)+'</textarea><div class="row"><button class="action primary" onclick="runDebug2()">Check Fix</button><button class="action" onclick="showDebugHint2()">Hint</button><button class="action" onclick="resetCurrentEditor()">Clear</button></div><div id="debugfb"></div>'+navButtons('nextDebug2','Next Debug')+'</div>';setTimeout(()=>restoreAnswer('debug',i,'#debugger'),0)}
function resetCurrentEditor(){const e=document.querySelector('#debugger');if(e){e.value=debugProgram(active('debug')[state.debugIndex%active('debug').length].code);saveCurrent()}}
function runDebug2(){saveCurrent();let q=active('debug')[state.debugIndex%active('debug').length],v=document.querySelector('#debugger').value,ok=q.checks.every(x=>v.replace(/\s+/g,' ').includes(x.replace(/\s+/g,' ')));let earned=ok&&addXP(25,'debug:'+state.level+':'+state.debugIndex);document.querySelector('#debugfb').innerHTML='<div class="feedback '+(ok?'good':'danger')+'"><b>'+(ok?'Bug fixed! +25 Score':'Not fixed yet.')+'</b> '+(ok?'Your code contains the required corrections.':'The required correction is still missing.')+(ok?'<div class="row"><button class="action primary" onclick="nextDebug2()">Next Debug</button></div>':'')+(ok&&!earned?'<div class="muted mini">Score already awarded for this problem.</div>':'')+'</div>'}
function showDebugHint2(){let q=active('debug')[state.debugIndex%active('debug').length];document.querySelector('#debugfb').innerHTML='<div class="feedback"><b>Hint:</b> '+q.hint+'</div>'}
function nextDebug2(){saveCurrent();state.debugIndex=(state.debugIndex+1)%active('debug').length;state.progress[state.level].debugIndex=state.debugIndex;render()}
function algo(c){let a=active('algo'),i=state.algoIndex,q=a[i%a.length],terms=['START','NUMBER','INPUT','OUTPUT','DISPLAY','IF','THEN','ELSE','ENDIF','FOR','TO','DO','WHILE','ENDWHILE','ENDFOR','CONTINUE','SWITCH','CASE','BREAK','DEFAULT','END'];c.innerHTML='<div class="panel">'+levelTabs()+'<div class="muted">'+difficulty[state.level].label+' Algo • '+(i+1)+' of '+a.length+'</div><h2>'+q.q+'</h2><p class="muted">Type your answer line by line. You can also tap a term below to insert it into the editor.</p><div class="steps">'+terms.map(t=>'<button class="step" onclick="insertAlgoTerm(\''+t+'\')">'+t+'</button>').join('')+'</div><textarea class="editor" id="algoanswer" placeholder="START\nNUMBER num1, num2, sum\nINPUT num1, num2\n...\nOUTPUT sum\nEND"></textarea><div class="row"><button class="action primary" onclick="checkAlgo2()">Check Algorithm</button><button class="action" onclick="document.querySelector(\'#algoanswer\').value=\'\'">Clear</button><button class="action" onclick="showAlgoHint2()">Hint</button></div><div id="algofb"></div>'+navButtons('nextAlgo2','Next Algorithm')+'</div>';setTimeout(()=>restoreAnswer('algo',i,'#algoanswer'),0)}
function insertAlgoTerm(t){let e=document.querySelector('#algoanswer'),p=e.selectionStart||e.value.length,before=e.value[p-1]||'';e.value=e.value.slice(0,p)+(p&&before!='\n'?' ':'')+t+e.value.slice(e.selectionEnd||p);e.focus();e.selectionStart=e.selectionEnd=p+t.length+(p&&before!='\n'?1:0)}
function normalizeAlgo(s){return s.toLowerCase().replace(/\r/g,'').replace(/[^a-z0-9%><=+*\n ]/g,' ').replace(/[ \t]+/g,' ').replace(/[ \t]*\n[ \t]*/g,'\n').trim()}
function algoConditionShape(s){return normalizeAlgo(s).replace(/\b[a-z_][a-z0-9_]*\b/g,'V').replace(/\b\d+(?:\.\d+)?\b/g,'N')}
function algoLineMatches(got,need){let a=normalizeAlgo(got),b=normalizeAlgo(need);if(a===b)return true;if(b==='start'||b==='end'||b==='else'||b==='endif'||b==='endfor'||b==='endwhile'||b==='continue'||b==='break'||b==='default')return a===b;if(/^(input|read)\b/.test(b)){if(!/^(input|read)\b/.test(a))return false;let want=b.replace(/^(input|read)\s*/,'').split(/\s*,\s*/).filter(Boolean),have=a.replace(/^(input|read)\s*/,'').split(/\s*,\s*/).filter(Boolean);return want.length===have.length}if(/^(display|output|print)\b/.test(b)){return /^(display|output|print)\b/.test(a)&&a.replace(/^(display|output|print)\s*/,'').trim().length>0}if(/^(number|declare)\b/.test(b)){if(!/^(number|declare)\b/.test(a))return false;let want=b.replace(/^(number|declare)\s*/,'').split(/\s*,\s*/).filter(Boolean),have=a.replace(/^(number|declare)\s*/,'').split(/\s*,\s*/).filter(Boolean);return want.length===have.length}if(b.startsWith('if ')){if(!/^if\b/.test(a))return false;return algoConditionShape(a.replace(/^if\s+/,'').replace(/\s+then$/,'').trim())===algoConditionShape(b.replace(/^if\s+/,'').replace(/\s+then$/,'').trim())}if(b.startsWith('for ')){if(!/^(for|repeat)\b/.test(a))return false;let body=b.replace(/^(for|repeat)\s+/,'');return a.includes(body)||(['to','do'].every(x=>!b.includes(x)||a.includes(x)))}if(b.startsWith('while ')){return /^while\b/.test(a)&&algoConditionShape(a.replace(/^while\s+/,'').replace(/\s+do$/,'').trim())===algoConditionShape(b.replace(/^while\s+/,'').replace(/\s+do$/,'').trim())}if(b.startsWith('switch '))return /^switch\b/.test(a);if(b.startsWith('case '))return /^case\b/.test(a)&&a.replace(/^case\s+/,'').trim()===b.replace(/^case\s+/,'').trim();if(b.includes('=')&&b.includes('+'))return a.includes('=')&&a.includes('+');if(b.includes('=')&&b.includes('*'))return a.includes('=')&&a.includes('*');if(b.includes('=')&&!/^if\b/.test(b))return a.includes('=');return false}
function checkAlgo2(){saveCurrent();let q=active('algo')[state.algoIndex%active('algo').length],v=normalizeAlgo(document.querySelector('#algoanswer').value),got=v.split('\n').map(x=>x.trim()).filter(Boolean),need=q.a.split('\n').map(x=>normalizeAlgo(x)).filter(Boolean),pos=-1,ok=true;for(let n=0;n<need.length;n++){let line=need[n],found=-1;for(let i=pos+1;i<got.length;i++){if(algoLineMatches(got[i],line)){found=i;break}}if(found<0){ok=false;break}pos=found}let earned=ok&&addXP(20,'algo:'+state.level+':'+state.algoIndex);document.querySelector('#algofb').innerHTML='<div class="feedback '+(ok?'good':'danger')+'"><b>'+(ok?'Algorithm accepted! +20 Score':'Not accepted yet.')+'</b> '+(ok?'Your steps are in the correct order. Equivalent pseudocode wording and variable names are accepted.':'Check the order, logic, and required control steps. Extra declaration lines are allowed.')+(ok?'<div class="row"><button class="action primary" onclick="nextAlgo2()">Next Algorithm</button></div>':'')+(ok&&!earned?'<div class="muted mini">Score already awarded for this problem.</div>':'')+'</div>'}
function showAlgoHint2(){let q=active('algo')[state.algoIndex%active('algo').length];document.querySelector('#algofb').innerHTML='<div class="feedback"><b>Hint:</b> '+q.h+'</div>'}
function nextAlgo2(){saveCurrent();state.algoIndex=(state.algoIndex+1)%active('algo').length;state.progress[state.level].algoIndex=state.algoIndex;render()}
function code(c){let a=active('code'),i=state.codeIndex,q=a[i%a.length];c.innerHTML='<div class="panel">'+levelTabs()+'<div class="muted">'+difficulty[state.level].label+' Coding • '+(i+1)+' of '+a.length+'</div><h2>'+q.q+'</h2><p class="muted">Blank editor: write the whole C program yourself. The checker looks for required concepts, not one exact wording or one exact output sentence.</p><textarea class="editor" id="editor" spellcheck="false" placeholder="#include &lt;stdio.h&gt;\n\nint main() {\n    ...\n}"></textarea><div class="row"><button class="action primary" onclick="runCode2()">Check Program</button><button class="action" onclick="showCodeHint2()">Hint</button><button class="action" onclick="document.querySelector(\'#editor\').value=\'\'">Clear</button></div><div id="codefb"></div>'+navButtons('nextCode2','Next Coding Problem')+'</div>';setTimeout(()=>restoreAnswer('code',i,'#editor'),0)}
function runCode2(){saveCurrent();let q=active('code')[state.codeIndex%active('code').length],v=document.querySelector('#editor').value,ok=false;try{ok=q.check(v)}catch(e){ok=false}let earned=ok&&addXP(30,'code:'+state.level+':'+state.codeIndex);document.querySelector('#codefb').innerHTML='<div class="feedback '+(ok?'good':'danger')+'"><b>'+(ok?'Program accepted! +30 Score':'Not accepted yet.')+'</b> '+(ok?'Your solution satisfies the required concepts. Many valid programs and output styles are accepted.':'Some required syntax/concepts are still missing. Check the prompt and hint.')+(ok?'<div class="row"><button class="action primary" onclick="nextCode2()">Next Coding Problem</button></div>':'')+(ok&&!earned?'<div class="muted mini">Score already awarded for this problem.</div>':'')+'</div>'}
function showCodeHint2(){let q=active('code')[state.codeIndex%active('code').length];document.querySelector('#codefb').innerHTML='<div class="feedback"><b>Hint:</b> '+q.h+'</div>'}
function nextCode2(){saveCurrent();state.codeIndex=(state.codeIndex+1)%active('code').length;state.progress[state.level].codeIndex=state.codeIndex;render()}
function attachAutoIndent(){document.querySelectorAll('textarea.editor').forEach(e=>{if(e.dataset.indentReady)return;e.dataset.indentReady='1';e.addEventListener('keydown',function(ev){if(ev.key==='Tab'){ev.preventDefault();let s=this.selectionStart,end=this.selectionEnd;this.setRangeText('    ',s,end,'end');return}if(ev.key==='Enter'){ev.preventDefault();let s=this.selectionStart,line=this.value.slice(0,s).split('\n').pop(),indent=(line.match(/^\s*/)||[''])[0],trim=line.trim(),after=this.value.slice(s);if(trim.endsWith('{')||/^(case\s+.+:|default:)\s*$/.test(trim))indent+='    ';if(after.match(/^\s*\}/)||/^(case\s+.+:|default:)\s*$/.test(after.split('\n')[0].trim()))indent=indent.slice(0,Math.max(0,indent.length-4));this.setRangeText('\n'+indent,s,s,'end')}})})}
function showCodeHint2(){let q=active('code')[state.codeIndex%active('code').length];document.querySelector('#codefb').innerHTML='<div class="feedback"><b>Hint:</b> '+q.h+'</div>'}
function nextCode2(){state.codeIndex=(state.codeIndex+1)%active('code').length;state.progress[state.level].codeIndex=state.codeIndex;render()}
render();
</script></body></html>
